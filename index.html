<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#364355">
  <meta name="description" content="课程、日程与待办，和 Windows 桌面日历同步。">
  <title>我的课表日历</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><p class="eyebrow">CALENDAR BOARD</p><h1>我的课表日历</h1></div>
      <button id="settingsButton" class="icon-button" type="button" aria-label="设置">⚙</button>
    </header>

    <section id="setupPanel" class="panel" hidden>
      <h2>连接你的云端日历</h2>
      <p class="muted">填写 Supabase 项目 URL 和 <strong>publishable key</strong>。不要填写 secret key。</p>
      <form id="setupForm" class="stack">
        <label>项目 URL<input id="projectUrl" type="url" placeholder="https://xxxxx.supabase.co" required autocomplete="url"></label>
        <label>Publishable key<input id="publishableKey" type="text" placeholder="sb_publishable_..." required autocomplete="off"></label>
        <button class="primary" type="submit">保存连接信息</button>
      </form>
    </section>

    <section id="authPanel" class="panel" hidden>
      <h2>登录日历</h2>
      <p class="muted">电脑端和手机端使用同一个日历账号。</p>
      <form id="authForm" class="stack">
        <label>邮箱<input id="email" type="email" required autocomplete="email"></label>
        <label>密码<input id="password" type="password" required autocomplete="current-password"></label>
        <div class="button-row"><button class="primary" type="submit">登录</button><button id="signupButton" type="button">注册账号</button></div>
      </form>
    </section>

    <div id="calendarApp" hidden>
      <section class="panel calendar-panel">
        <div class="month-header">
          <div><p class="eyebrow">MONTH VIEW</p><h2 id="monthTitle"></h2></div>
          <div class="month-controls"><button id="prevMonth" type="button" aria-label="上个月">‹</button><button id="todayButton" type="button">今天</button><button id="nextMonth" type="button" aria-label="下个月">›</button></div>
        </div>
        <div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div id="monthGrid" class="month-grid" aria-label="月历"></div>
      </section>

      <section class="day-section">
        <div class="day-heading"><div><p class="eyebrow">SELECTED DAY</p><h2 id="dayTitle"></h2></div><button id="addButton" class="primary" type="button">＋ 添加</button></div>
        <div id="dayItems"></div>
      </section>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <dialog id="entryDialog">
    <form id="entryForm" class="stack">
      <h2 id="entryDialogTitle">新增事项</h2>
      <label>类别<select id="entryType"><option>课程</option><option>待办</option><option>日程</option></select></label>
      <label>日期<input id="entryDate" type="date" required></label>
      <label>内容<textarea id="entryTitle" rows="3" maxlength="1000" required></textarea></label>
      <div class="time-row"><label>开始时间<input id="entryStart" type="time"></label><label>结束时间<input id="entryEnd" type="time"></label></div>
      <label>场地<input id="entryPlace" type="text" maxlength="200" placeholder="可留空"></label>
      <div class="button-row"><button id="cancelEntry" type="button">取消</button><button class="primary" type="submit">保存</button></div>
    </form>
  </dialog>
</body>
</html>
